apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.name}}
  labels:
    app: {{.Values.name}}
    env: {{.Values.environment}}
spec:
  replicas: {{.Values.replicas}}
  selector:
    matchLabels:
      app: {{.Values.name}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired count during a rollout, so the external IP
      # keeps serving throughout. This is what makes the version-bump
      # demonstration show a clean cutover rather than a brief outage.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: {{.Values.name}}
        # Not part of the selector — Harness adds its own canary/stable tracking
        # labels, and widening the selector would fight with them. This is here
        # purely so `kubectl get pods -L env` makes the promotion visible.
        env: {{.Values.environment}}
    spec:
      containers:
        - name: {{.Values.name}}
          image: {{.Values.image}}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BUILD_ID
              value: "{{.Values.buildId}}"
          # Readiness gates traffic; liveness gates restarts. They are deliberately
          # different endpoints: a pod that is briefly busy should be pulled from
          # the Service, not killed.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          # Requests are what the scheduler packs against. Without them the pods
          # would compete with the Harness delegate on a two-node cluster and
          # could sit Pending.
          resources:
            requests:
              cpu: {{.Values.cpuRequest}}
              memory: {{.Values.memoryRequest}}
            limits:
              memory: {{.Values.memoryLimit}}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem is on, but the JVM still needs a writable
            # temp dir. An emptyDir keeps it writable without unlocking the
            # whole filesystem.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
