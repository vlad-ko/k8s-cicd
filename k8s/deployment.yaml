apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.name}}
  labels:
    app: {{.Values.name}}
    env: {{.Values.environment}}
spec:
  replicas: {{.Values.replicas}}
  selector:
    matchLabels:
      app: {{.Values.name}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired count during a rollout, so the external IP
      # keeps serving throughout. This is what makes the version-bump
      # demonstration show a clean cutover rather than a brief outage.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: {{.Values.name}}
        # Not part of the selector — Harness adds its own canary/stable tracking
        # labels, and widening the selector would fight with them. This is here
        # purely so `kubectl get pods -L env` makes the promotion visible.
        env: {{.Values.environment}}
    spec:
      containers:
        - name: {{.Values.name}}
          image: {{.Values.image}}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BUILD_ID
              value: "{{.Values.buildId}}"
            # Server-side Anthropic key for /api/ask, sourced from the Harness
            # secret manager. optional: true means a missing secret degrades the
            # feature rather than blocking the pod from starting — the app
            # already returns a friendly warming-up response without it.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{.Values.secretName}}
                  key: ANTHROPIC_API_KEY
                  optional: true
          # Readiness gates traffic; liveness gates restarts. Deliberately
          # different endpoints, and both answer before any application logic so
          # a fault in the app cannot make a healthy pod look unschedulable.
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: {{.Values.cpuRequest}}
              memory: {{.Values.memoryRequest}}
            limits:
              memory: {{.Values.memoryLimit}}
          securityContext:
            runAsNonRoot: true
            # Numeric, not the `node` username. Kubernetes cannot verify a
            # username is non-root without starting the container, so
            # runAsNonRoot rejects a non-numeric USER outright with
            # CreateContainerConfigError. 1000 is the uid of `node` in
            # node:22-alpine (verified: `id` reports uid=1000(node)).
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem is on; Node still wants a writable temp dir.
            # An emptyDir keeps it writable without unlocking the filesystem.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
