# Base values. Harness resolves this file first, then layers the matching
# environment file from k8s/env/<environment>/values.yaml over the top via an
# Environment-level Service Override — later files win.
#
# Keys here MUST match the {{.Values.x}} references in deployment.yaml and
# service.yaml. A typo surfaces as a rendering failure at deploy time, not at
# commit time, so treat this file and the manifests as one unit.
#
# Deliberately flat rather than nested: {{.Values.cpuRequest}} is harder to get
# wrong than {{.Values.resources.requests.cpu}}, and the override files stay
# trivial to read in a diff.

name: harness-lab-app

# Overridden per environment. The base value is intentionally conservative so
# that a missing override under-provisions rather than over-provisions.
replicas: 1

# Resolved by Harness at runtime from the artifact configured on the Service.
# Never hard-code an image reference here: that would decouple the deployed
# artifact from the one the CI stage just built and pushed.
image: <+artifact.image>

# The Harness pipeline execution that produced the running image. Surfaced by
# the app at GET / so a live pod can be traced back to its pipeline run.
buildId: <+pipeline.sequenceId>

# Overridden per environment; surfaced as a pod label so `kubectl get pods -L env`
# makes the promotion visible.
environment: unset

cpuRequest: 100m
memoryRequest: 384Mi
memoryLimit: 768Mi
