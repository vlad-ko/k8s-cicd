apiVersion: v1
kind: Service
metadata:
  name: {{.Values.name}}
  labels:
    app: {{.Values.name}}
spec:
  # ClusterIP, not LoadBalancer. The nginx Ingress terminates TLS and routes by
  # hostname, so each environment no longer needs its own L4 load balancer —
  # one ingress IP serves both, which is cheaper and gives real hostnames
  # instead of bare IPs.
  type: ClusterIP
  selector:
    app: {{.Values.name}}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
